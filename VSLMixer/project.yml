# Generate VSLMixer.xcodeproj with:  xcodegen generate
name: VSLMixer
options:
  bundleIdPrefix: com.jefftk
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  VSLMixer:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Engine
      - path: Remote      # the phone control page, copied into the bundle as a folder
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VSL Mixer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: VSL Mixer needs audio input access to mix the signals coming into your interface.
        NSLocalNetworkUsageDescription: VSL Mixer serves a control page so phones on your network can adjust their monitor mixes.
        NSBonjourServices: ["_http._tcp"]
    entitlements:
      path: App/VSLMixer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.assets.music.read-write: true
        com.apple.security.network.server: true
        # Network.framework needs this to reply on connections it accepted
        # from other devices; without it the sandbox drops them (localhost
        # still works, which hides the problem).
        com.apple.security.network.client: true
        # The sandbox only lets it share memory under an app group's name;
        # this is the one Jammer writes its output to (Engine/jammer_link.h).
        com.apple.security.application-groups: [C58DMTY76R.jefftk.audio]
    settings:
      base:
        PRODUCT_NAME: VSL Mixer
        PRODUCT_BUNDLE_IDENTIFIER: com.jefftk.vslmixer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/BridgingHeader.h
        GCC_C_LANGUAGE_STANDARD: c11
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: C58DMTY76R
      configs:
        Debug:
          # Signed with a real identity so macOS remembers the microphone
          # permission across rebuilds (ad-hoc builds get re-prompted).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
